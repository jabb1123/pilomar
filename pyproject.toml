[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pilomar"
version = "1.0.0"
description = "Raspberry Pi-based miniature observatory control software"
authors = [
    { name = "Short-bus", email = "noreply@github.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "skyfield",
    "pandas",
    "numpy",
    "astropy",
    "gpiod",
    "RPi.GPIO; platform_system == 'Linux'",
]

[tool.setuptools.packages.find]
where = ["pilomar"]

[project.urls]
Homepage = "https://github.com/Short-bus/pilomar"
Documentation = "https://github.com/Short-bus/pilomar/wiki"
